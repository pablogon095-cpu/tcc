<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Checklist colaborativo do TCC</title>
<style>
:root{color-scheme:light dark;--bg:#f5f6f8;--panel:#fff;--text:#20242b;--muted:#69717d;--line:#e1e5ea;--accent:#2463eb;--done:#14804a}@media(prefers-color-scheme:dark){:root{--bg:#12151a;--panel:#1b2027;--text:#edf0f4;--muted:#a0a8b4;--line:#343b46;--accent:#83a8ff;--done:#5bd49a}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}main{width:min(900px,100% - 32px);margin:32px auto}header,.toolbar,.section,.task,.notice{background:var(--panel);border:1px solid var(--line);border-radius:14px}header{padding:24px;margin-bottom:16px}h1{margin:0 0 6px;font-size:clamp(1.5rem,4vw,2rem)}.muted{color:var(--muted)}.progress-line{height:9px;background:var(--line);border-radius:999px;overflow:hidden;margin:16px 0 8px}#progress{height:100%;width:0;background:var(--accent);transition:width .2s}.toolbar{padding:12px;display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}button,select{font:inherit;color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:8px 12px;cursor:pointer}button:hover{border-color:var(--accent)}.sections{display:grid;gap:16px}.section{overflow:hidden}.section h2{margin:0;padding:14px 16px;font-size:1.05rem;background:var(--bg);border-bottom:1px solid var(--line)}.table-wrap{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:580px;text-align:left}th,td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:top}th{background:var(--panel);font-weight:700}th:first-child,td:first-child{width:90px;text-align:center}tbody tr:last-child td{border-bottom:0}tbody tr.completed td:last-child{text-decoration:line-through;color:var(--muted)}td input{width:18px;height:18px;cursor:pointer;accent-color:var(--done)}@media(max-width:600px){main{width:calc(100% - 16px);margin:12px auto}header{padding:16px}th,td{padding:10px}}.notice{padding:12px 16px;margin-bottom:16px}.notice.error{border-color:#c44}.notice.success{border-color:var(--done)}.empty{padding:24px;text-align:center;color:var(--muted)}footer{text-align:center;font-size:.85rem;color:var(--muted);padding:20px 0}@media print{body{background:white;color:black}main{width:100%;margin:0}.toolbar,footer,#status{display:none}header,.section,.task{background:white;border-color:#ccc;break-inside:avoid}}
</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./config.js"></script></head>
<body><main><header><h1>Checklist colaborativo do TCC</h1><div class="muted">Checklist compartilhado para o projeto de reaproveitamento de PET.</div><div class="progress-line" aria-label="Progresso geral"><div id="progress"></div></div><strong id="progressText">Conectando ao banco de dados…</strong></header>
<div id="status" class="notice" role="status">Conectando ao banco de dados compartilhado…</div><div class="toolbar"><button id="copyBtn">Copiar checklist</button><button id="exportBtn">Baixar checklist (.txt)</button><button id="printBtn">Imprimir</button></div><div id="sections" class="sections"></div><footer>As marcações são compartilhadas e sincronizadas em tempo real entre todos que acessam este link.</footer></main>
<script>
const data=[["1. Objetivos e Estrutura",["Incluir controle PID e filtro EMA nos objetivos específicos.","Apresentar resultados da interface Nextion no capítulo 4.","Igualar o título da Capa com o da Folha de Rosto.","Padronizar o termo \"automatizada\" ou \"semiautomática\".","Corrigir divergências: Arduino/ESP32, Fonte 24V/9V, MOSFET IRF540/IRF530."]],["2. Introdução e Teoria",["Reescrever 1.1 para não repetir o objetivo geral.","Adicionar parágrafo final explicando a lacuna deixada por trabalhos anteriores.","Focar a justificativa no reaproveitamento de PET (remover \"redução de custo\").","Listar as inovações de Kuhn e Ulian (2023) citadas no cap. 3.","Bannach et al. (2011): incluir nas referências e remover as não citadas."]],["3. Metodologia",["Mover o ajuste do PID (3.9) para antes dos testes de extrusão (3.5).","Informar se testes de diâmetro usaram PID, histerese ou PWM.","Mover testes falhos (A4988, L298N) para Resultados; deixar só o planejado.","Inserir número de dentes e cálculo numérico do torque da transmissão (3.6.1)."]],["4. Resultados",["Inserir gráfico de aquecimento do PID (tempo de subida, overshoot, erro).","Discutir a estabilidade térmica ao puxar o filamento frio.","Mostrar média, desvio padrão e ovalização do diâmetro do filamento.","Tabela de tração comparando drivers (A4988, L298N, DM556), corrente e perdas.","Dados de produção: metros/garrafa e metros/hora.","Prints da interface Nextion com lista de ajustes e monitoramento.","Fotos de cubos impressos, erro dimensional (paquímetro) e defeitos observados.","Discutir a divergência da temperatura (260–280 °C) em relação à literatura."]],["5. Conclusão",["Remover do \"trabalho futuro\" o carretel removível (já foi feito em 4.3)."]]],allTasks=data.flatMap(([section,tasks],s)=>tasks.map((task,i)=>({id:`${s+1}-${i+1}`,section,task}))),checked={};const root=document.getElementById("sections"),statusEl=document.getElementById("status");let client=null,busy=new Set();
function status(message,type=""){statusEl.textContent=message;statusEl.className="notice"+(type?" "+type:"")}
function updateProgress(){const count=allTasks.filter(t=>checked[t.id]).length,pct=Math.round(count/allTasks.length*100);document.getElementById("progress").style.width=pct+"%";document.getElementById("progressText").textContent=`${count} de ${allTasks.length} tarefas concluídas (${pct}%)`}
function render(){root.innerHTML="";for(const [s,tasks] of data.entries()){const section=document.createElement("section");section.className="section";const heading=document.createElement("h2");heading.textContent=data[s][0];section.appendChild(heading);const wrap=document.createElement("div");wrap.className="table-wrap";const table=document.createElement("table");const thead=document.createElement("thead");const headRow=document.createElement("tr");for(const label of ["Status","Tarefa"]){const th=document.createElement("th");th.textContent=label;headRow.appendChild(th)}thead.appendChild(headRow);table.appendChild(thead);const tbody=document.createElement("tbody");for(const [i,task] of tasks.entries()){const id=`${s+1}-${i+1}`;const tr=document.createElement("tr");if(checked[id])tr.className="completed";const statusCell=document.createElement("td");const input=document.createElement("input");input.type="checkbox";input.checked=!!checked[id];input.disabled=busy.has(id)||!client;input.setAttribute("aria-label","Concluir: "+task);input.addEventListener("change",()=>toggle(id,input.checked));statusCell.appendChild(input);const taskCell=document.createElement("td");taskCell.textContent=task;tr.append(statusCell,taskCell);tbody.appendChild(tr)}table.appendChild(tbody);wrap.appendChild(table);section.appendChild(wrap);root.appendChild(section)}updateProgress()}function checklistText(){return allTasks.map(t=>`${checked[t.id]?"[x]":"[ ]"} | ${t.section} | ${t.task}`).join("\n")}
async function toggle(id,value){const old=!!checked[id];checked[id]=value;busy.add(id);render();try{const {data:updated,error}=await client.from("tcc_tasks").update({completed:value,updated_at:new Date().toISOString()}).eq("id",id).select("id,completed").maybeSingle();if(error)throw error;if(!updated)throw new Error("Nenhuma linha foi atualizada. Verifique as políticas de UPDATE no Supabase.");checked[id]=updated.completed;status("Alteração salva no banco. Sincronização em tempo real ativa se o canal estiver conectado.","success")}catch(e){checked[id]=old;status("Não foi possível salvar: "+e.message,"error")}finally{busy.delete(id);render()}}
async function init(){const cfg=window.TCC_CONFIG;if(!window.supabase||!cfg||!cfg.url||!cfg.anonKey||cfg.url.includes("COLE_")||cfg.anonKey.includes("COLE_")){status("Falta configurar o Supabase. Veja as instruções no README do repositório.","error");render();return}client=window.supabase.createClient(cfg.url,cfg.anonKey);const {data:rows,error}=await client.from("tcc_tasks").select("id,completed");if(error){status("Falha ao ler o checklist no Supabase: "+error.message+". Os controles continuam habilitados para testar a gravação; se ela falhar, a mensagem mostrará o erro exato.","error");render();client.channel("tcc-checklist-live").on("postgres_changes",{event:"*",schema:"public",table:"tcc_tasks"},payload=>{const row=payload.new;if(row&&row.id){checked[row.id]=row.completed;render()}}).subscribe(state=>{if(state==="CHANNEL_ERROR"||state==="TIMED_OUT")status("Falha de leitura e canal em tempo real ("+state+"). Erro original: "+error.message,"error")});return}for(const row of rows)checked[row.id]=row.completed;const missing=allTasks.filter(t=>!Object.prototype.hasOwnProperty.call(checked,t.id));if(missing.length)status("Banco conectado, mas faltam "+missing.length+" tarefas. Execute o SQL de configuração.","error");else status("Conectado. Alterações sincronizadas em tempo real.","success");render();client.channel("tcc-checklist-live").on("postgres_changes",{event:"*",schema:"public",table:"tcc_tasks"},payload=>{const row=payload.new;if(row&&row.id){checked[row.id]=row.completed;render()}}).subscribe(state=>{if(state==="SUBSCRIBED"){status("Banco conectado; atualizações em tempo real ativas.","success")}else if(state==="CHANNEL_ERROR"||state==="TIMED_OUT"){status("Banco conectado. Canal em tempo real indisponível ("+state+"); a página tentará sincronizar por consulta periódica.","error")}else if(state==="CLOSED"){status("Canal de tempo real fechado; a página tentará sincronizar por consulta periódica.","error")}});setInterval(async()=>{if(!client||busy.size)return;const {data:latest,error:syncError}=await client.from("tcc_tasks").select("id,completed");if(syncError)return;let changed=false;for(const row of latest){if(!busy.has(row.id)&&checked[row.id]!==row.completed){checked[row.id]=row.completed;changed=true}}if(changed)render()},3000)}
async function copyText(){const text=checklistText();try{await navigator.clipboard.writeText(text);status("Checklist copiado.","success")}catch(_){download(text)}}function download(text){const blob=new Blob([text],{type:"text/plain;charset=utf-8"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download="checklist-tcc.txt";a.click();URL.revokeObjectURL(url)}document.getElementById("copyBtn").addEventListener("click",copyText);document.getElementById("exportBtn").addEventListener("click",()=>download(checklistText()));document.getElementById("printBtn").addEventListener("click",()=>window.print());init();
</script></body></html>
