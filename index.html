<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Checklist de revisão do TCC</title>
<style>
  :root { color-scheme: light dark; --bg: #f5f6f8; --panel: #fff; --text: #20242b; --muted: #69717d; --line: #e1e5ea; --accent: #2463eb; --done: #14804a; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #12151a; --panel: #1b2027; --text: #edf0f4; --muted: #a0a8b4; --line: #343b46; --accent: #83a8ff; --done: #5bd49a; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, -apple-system, Segoe UI, sans-serif; }
  main { width: min(900px, 100% - 32px); margin: 36px auto; }
  header, .toolbar, .section, .task { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; }
  header { padding: 24px; margin-bottom: 16px; }
  h1 { margin: 0 0 6px; font-size: clamp(1.5rem, 4vw, 2rem); }
  .muted { color: var(--muted); }
  .progress-line { height: 9px; background: var(--line); border-radius: 999px; overflow: hidden; margin: 16px 0 8px; }
  #progress { height: 100%; width: 0; background: var(--accent); transition: width .2s; }
  .toolbar { padding: 12px; display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
  button, select { font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--line); border-radius: 9px; padding: 8px 12px; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); color: white; border-color: var(--accent); }
  .sections { display: grid; gap: 12px; }
  .section { overflow: hidden; }
  .section h2 { margin: 0; font-size: 1.05rem; padding: 14px 16px; border-bottom: 1px solid var(--line); }
  .tasks { padding: 4px 16px; }
  .task { display: flex; align-items: flex-start; gap: 12px; padding: 12px; margin: 10px 0; cursor: pointer; }
  .task input { width: 18px; height: 18px; margin-top: 3px; flex: 0 0 auto; accent-color: var(--done); }
  .task span { flex: 1; }
  .task.completed span { text-decoration: line-through; color: var(--muted); }
  .empty { padding: 24px; text-align: center; color: var(--muted); }
  footer { text-align: center; font-size: .85rem; color: var(--muted); padding: 20px 0; }
  @media print {
    body { background: white; color: black; }
    main { width: 100%; margin: 0; }
    .toolbar, footer { display: none; }
    header, .section, .task { background: white; border-color: #ccc; break-inside: avoid; }
  }
</style>
</head>
<body>
<main>
  <header>
    <h1>Checklist de revisão do TCC</h1>
    <div class="muted">Acompanhe as correções do projeto de reaproveitamento de PET.</div>
    <div class="progress-line" aria-label="Progresso geral"><div id="progress"></div></div>
    <strong id="progressText">0 de 23 tarefas concluídas (0%)</strong>
  </header>
  <div class="toolbar">
    <label for="filter" class="muted" style="align-self:center">Exibir:</label>
    <select id="filter" aria-label="Filtrar tarefas">
      <option value="all">Todas as tarefas</option><option value="pending">Pendentes</option><option value="completed">Concluídas</option>
    </select>
    <button id="copyBtn">Copiar checklist</button><button id="exportBtn">Baixar checklist (.txt)</button><button id="printBtn">Imprimir</button><button id="resetBtn">Desmarcar tudo</button>
  </div>
  <div id="sections" class="sections"></div>
  <footer>O progresso é salvo automaticamente neste navegador neste dispositivo.</footer>
</main>
<script>
const data = [
  ["1. Objetivos e Estrutura", [
    "Incluir controle PID e filtro EMA nos objetivos específicos.",
    "Apresentar resultados da interface Nextion no capítulo 4.",
    "Igualar o título da Capa com o da Folha de Rosto.",
    'Padronizar o termo "automatizada" ou "semiautomática".',
    "Corrigir divergências: Arduino/ESP32, Fonte 24V/9V, MOSFET IRF540/IRF530."
  ]],
  ["2. Introdução e Teoria", [
    "Reescrever 1.1 para não repetir o objetivo geral.",
    "Adicionar parágrafo final explicando a lacuna deixada por trabalhos anteriores.",
    'Focar a justificativa no reaproveitamento de PET (remover "redução de custo").',
    "Listar as inovações de Kuhn e Ulian (2023) citadas no cap. 3.",
    "Incluir Bannach et al. (2011) nas referências e remover as não citadas."
  ]],
  ["3. Metodologia", [
    "Mover o ajuste do PID (3.9) para antes dos testes de extrusão (3.5).",
    "Informar se testes de diâmetro usaram PID, histerese ou PWM.",
    "Mover testes falhos (A4988, L298N) para Resultados; deixar só o planejado.",
    "Inserir número de dentes e cálculo numérico do torque da transmissão (3.6.1)."
  ]],
  ["4. Resultados", [
    "Inserir gráfico de aquecimento do PID (tempo de subida, overshoot, erro).",
    "Discutir a estabilidade térmica ao puxar o filamento frio.",
    "Mostrar média, desvio padrão e ovalização do diâmetro do filamento.",
    "Tabela de tração comparando drivers (A4988, L298N, DM556), corrente e perdas.",
    "Dados de produção: metros/garrafa e metros/hora.",
    "Prints da interface Nextion com lista de ajustes e monitoramento.",
    "Fotos de cubos impressos, erro dimensional (paquímetro) e defeitos observados.",
    "Discutir a divergência da temperatura (260–280 °C) em relação à literatura."
  ]],
  ["5. Conclusão", [
    'Remover do "trabalho futuro" o carretel removível (já foi feito em 4.3).'
  ]]
];
const KEY = "tcc-checklist-v1";
let checked = {};
try { checked = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch (_) { checked = {}; }
const root = document.getElementById("sections");
const filter = document.getElementById("filter");
const allTasks = data.flatMap(([section, tasks]) => tasks.map((task, i) => ({ id: section + "::" + i, section, task })));
function save() { try { localStorage.setItem(KEY, JSON.stringify(checked)); } catch (_) {} }
function updateProgress() {
  const count = allTasks.filter(t => checked[t.id]).length;
  const pct = Math.round(count / allTasks.length * 100);
  document.getElementById("progress").style.width = pct + "%";
  document.getElementById("progressText").textContent = `${count} de ${allTasks.length} tarefas concluídas (${pct}%)`;
}
function render() {
  root.innerHTML = "";
  const mode = filter.value;
  let visible = 0;
  for (const [section, tasks] of data) {
    const items = tasks.map((task, i) => ({ id: section + "::" + i, task, done: !!checked[section + "::" + i] }))
      .filter(t => mode === "all" || (mode === "completed" ? t.done : !t.done));
    if (!items.length) continue;
    visible += items.length;
    const sectionEl = document.createElement("section");
    sectionEl.className = "section";
    const heading = document.createElement("h2"); heading.textContent = section; sectionEl.appendChild(heading);
    const list = document.createElement("div"); list.className = "tasks";
    for (const item of items) {
      const label = document.createElement("label"); label.className = "task" + (item.done ? " completed" : "");
      const input = document.createElement("input"); input.type = "checkbox"; input.checked = item.done; input.setAttribute("aria-label", item.task);
      input.addEventListener("change", () => { checked[item.id] = input.checked; save(); render(); updateProgress(); });
      const span = document.createElement("span"); span.textContent = item.task; label.append(input, span); list.appendChild(label);
    }
    sectionEl.appendChild(list); root.appendChild(sectionEl);
  }
  if (!visible) { const empty = document.createElement("div"); empty.className = "empty"; empty.textContent = "Nenhuma tarefa neste filtro."; root.appendChild(empty); }
  updateProgress();
}
function checklistText() { return allTasks.map(t => `${checked[t.id] ? "[x]" : "[ ]"} | ${t.section} | ${t.task}`).join("\n"); }
filter.addEventListener("change", render);
document.getElementById("copyBtn").addEventListener("click", async () => {
  const text = checklistText();
  try { await navigator.clipboard.writeText(text); document.getElementById("copyBtn").textContent = "Copiado!"; setTimeout(() => document.getElementById("copyBtn").textContent = "Copiar checklist", 1600); }
  catch (_) { const blob = new Blob([text], {type:"text/plain;charset=utf-8"}); const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "checklist-tcc.txt"; a.click(); URL.revokeObjectURL(a.href); }
});
document.getElementById("exportBtn").addEventListener("click", () => { const blob = new Blob([checklistText()], {type:"text/plain;charset=utf-8"}); const url = URL.createObjectURL(blob); const a = document.createElement("a"); a.href = url; a.download = "checklist-tcc.txt"; a.click(); URL.revokeObjectURL(url); });
document.getElementById("printBtn").addEventListener("click", () => window.print());
document.getElementById("resetBtn").addEventListener("click", () => { if (confirm("Tem certeza de que deseja desmarcar todas as tarefas?")) { checked = {}; save(); render(); } });
render();
</script>
</body>
</html>
